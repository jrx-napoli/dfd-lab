data:
  # Paths to shard datasets
  shards_dir: "data/processed/FakeAVCeleb_v1.2_snr10/shards"
  test_index: "index_val.csv"
  
  # Data loading configuration
  batch_size: 8
  num_workers: 1
  pin_memory: true
  frames_per_clip: 32

model:
  # Model type
  name: "CNNLSTMDetector"
  module_path: "src.models.cnn_lstm"
  num_classes: 2
  model_params:
    # hidden_size: 512
    # backbone_video: "resnet18"
    # backbone_audio: "resnet18"

evaluation:
  checkpoint_path: "check_cnn_lstm/last.ckpt"
  device: "cuda"  # Options: "cuda", "cpu", "auto"
  limit_batches: null # Set to integer for debugging

  metrics:
    - "accuracy"
    - "f1_score"
    - "auc_roc"
    - "confusion_matrix"
  
  output_dir: "evaluation_results_cnn_snr10"

loss:
  name: "cross_entropy"
