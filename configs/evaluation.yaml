data:
  # Paths to shard datasets
  shards_dir: "data/processed/FakeAVCeleb_v1.2/shards"
  test_index: "new_index_val.csv"
  
  # Data loading configuration
  batch_size: 8
  num_workers: 1
  pin_memory: true
  frames_per_clip: 32

model:
  # Model type
  name: "CNNLSTMDetector"
  module_path: "src.models.cnn_lstm"
  num_classes: 2
  model_params:
    # embed_dim: 256
    # freeze_encoders: true

evaluation:
  checkpoint_path: "checkpoints-cnn/best-epoch=20-val_loss=0.00.ckpt"
  device: "cuda"  # Options: "cuda", "cpu", "auto"
  limit_batches: null # Set to integer for debugging
  method_statistics: true  # Enable per-method breakdown (requires 'method' in metadata)

  metrics:
    - "accuracy"
    - "f1_score"
    - "auc_roc"
    - "confusion_matrix"
  
  output_dir: "evaluation_results_cnn"

loss:
  name: "cross_entropy"